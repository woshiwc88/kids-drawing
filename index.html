<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff7ee">
<meta name="description" content="豆豆的画板 · 适合小朋友的离线画画小应用">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>豆豆的画板</title>
<style>
/* ===== 设计变量 ===== */
:root{
  --bg:#fff7ee;
  --bg2:#fff1f7;
  --panel:#ffffff;
  --ink:#4a3c58;
  --ink-soft:#8d80a0;
  --line:#efe6f7;
  --brand:#ff8a5c;
  --brand-2:#7c5cff;
  --ok:#4cc86b;
  --shadow:0 6px 18px rgba(110,70,150,.14);
  --shadow-up:0 -8px 24px rgba(110,70,150,.16);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --topbar-h:56px;
  --toolbar-h:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  position:fixed;inset:0;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
}
button{font-family:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer}
.hidden{display:none !important}

/* ===== 内联 SVG 图标：统一圆头线条风格，颜色跟随所在按钮的文字色 ===== */
.ic{
  width:26px;height:26px;flex:0 0 auto;display:block;
  fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
}
.ic-btn .ic{width:25px;height:25px}
#fsbar button .ic{width:24px;height:24px}
@media (max-height:600px){
  .ic{width:23px;height:23px}
  .ic-btn .ic{width:22px;height:22px}
}

/* ===== 整体布局 ===== */
#app{position:absolute;inset:0;display:flex;flex-direction:column;height:100%}

/* 顶栏 */
#topbar{
  flex:0 0 auto;
  height:calc(var(--topbar-h) + var(--safe-t));
  padding:var(--safe-t) 10px 0;
  display:flex;align-items:center;gap:8px;
}
.ic-btn{
  width:48px;height:48px;min-width:48px;
  border-radius:16px;
  background:#fff;
  box-shadow:var(--shadow);
  font-size:23px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s,opacity .15s;
}
.ic-btn:active{transform:scale(.92)}
.ic-btn[disabled]{opacity:.32}
.ic-btn.on{background:linear-gradient(180deg,#fff5ec,#ffe6d6);box-shadow:0 0 0 3px #ffd0b0,var(--shadow)}
#title{
  flex:1;text-align:center;font-size:20px;font-weight:800;letter-spacing:1px;
  color:var(--brand-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.top-right{display:flex;gap:8px}

/* 画布舞台 */
#stage{
  position:relative;
  flex:1 1 auto;min-height:0;
  margin:6px 8px 8px;
  border-radius:22px;
  background:#fff;
  box-shadow:var(--shadow);
  overflow:hidden;
  touch-action:none;
}
#draw,#preview{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  touch-action:none;
}
#preview{pointer-events:none}
#hint{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:17px;color:var(--ink-soft);
  background:rgba(255,255,255,.86);
  padding:10px 18px;border-radius:999px;
  pointer-events:none;transition:opacity .5s;
}

/* 底部工具栏 */
#toolbar{
  flex:0 0 auto;
  height:calc(var(--toolbar-h) + var(--safe-b));
  padding:0 4px var(--safe-b);
  display:flex;align-items:stretch;
  background:#fff;border-radius:22px 22px 0 0;
  box-shadow:var(--shadow-up);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:12px;font-weight:700;color:var(--ink-soft);
  border-radius:18px;margin:6px 3px;transition:transform .1s,background .15s;
}
.tab:active{transform:scale(.94)}
.tab .tab-ic{position:relative;display:flex;align-items:center;justify-content:center;height:26px;font-size:24px;line-height:1}
.tab.on{background:#f4efff;color:var(--brand-2)}
.tab.danger.on{background:#ffefef;color:#e8433a}
/* 颜色按钮右下角的「当前色」小圆点 */
.dot{
  position:absolute;right:-7px;bottom:-4px;
  width:13px;height:13px;border-radius:50%;
  box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(140,120,170,.22);
}

/* 弹出面板 */
.panel{
  position:absolute;left:0;right:0;
  bottom:calc(var(--toolbar-h) + var(--safe-b));
  background:#fff;border-radius:22px 22px 0 0;
  box-shadow:var(--shadow-up);
  padding:12px 14px calc(14px + var(--safe-b));
  max-height:52%;overflow-y:auto;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;
  animation:up .18s ease-out;
  z-index:20;
}
@keyframes up{from{transform:translateY(16px);opacity:.4}to{transform:translateY(0);opacity:1}}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.panel-head span{font-size:16px;font-weight:800}
.close-x{
  width:40px;height:40px;border-radius:14px;background:#f6f2fb;
  font-size:22px;color:var(--ink-soft);line-height:1;
}
.sub-title{font-size:14px;font-weight:800;color:var(--ink-soft);margin:14px 0 8px}

/* 颜色圆点 */
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.swatch{
  position:relative;aspect-ratio:1/1;border-radius:50%;
  box-shadow:inset 0 0 0 3px #fff,0 0 0 2px #e9e2f2,0 3px 8px rgba(110,70,150,.12);
  transition:transform .12s;
}
.swatch:active{transform:scale(.9)}
.swatch.on{transform:scale(1.06);box-shadow:inset 0 0 0 3px #fff,0 0 0 4px var(--brand-2),0 4px 10px rgba(110,70,150,.2)}
.swatch.on::after{
  content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);
}
.panel-foot{margin-top:14px;display:flex;gap:10px}
.more-color{
  flex:1;height:52px;border-radius:18px;
  background:linear-gradient(135deg,#ffd76e,#ff9ec4 55%,#9ad8ff);
  color:#fff;font-size:17px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  text-shadow:0 1px 3px rgba(0,0,0,.18);box-shadow:var(--shadow);
}
.more-color:active{transform:scale(.97)}
#colorPicker{position:absolute;opacity:0;width:0;height:0;pointer-events:none}

/* 笔刷 / 尺寸 / 贴纸 / 图形 网格 */
.grid-brush{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid-sticker{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid-shape{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:64px;border-radius:18px;background:#f8f5fd;
  font-size:26px;line-height:1;transition:transform .1s,box-shadow .15s;
}
.cell i{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-soft)}
.stk-img{width:36px;height:36px;display:block;pointer-events:none}
.cell .ic{width:30px;height:30px}
.cell:active{transform:scale(.93)}
.cell.on{background:#f1eaff;box-shadow:0 0 0 3px #cabaff inset}
.cell.on i{color:var(--brand-2)}
.grid-size{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.size-btn{
  height:56px;border-radius:18px;background:#f8f5fd;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:13px;font-weight:800;color:var(--ink-soft);
}
.size-btn .bar{background:var(--ink);border-radius:99px}
.size-btn.on{background:#f1eaff;color:var(--brand-2);box-shadow:0 0 0 3px #cabaff inset}
.size-btn.on .bar{background:var(--brand-2)}
.tip{font-size:12px;color:var(--ink-soft);margin-top:12px;text-align:center;line-height:1.5}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(70,45,95,.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.card{
  width:min(330px,86vw);background:#fff;border-radius:28px;
  padding:22px 18px 18px;text-align:center;box-shadow:0 16px 40px rgba(70,45,95,.28);
  animation:pop .18s ease-out;
}
@keyframes pop{from{transform:scale(.9);opacity:.3}to{transform:scale(1);opacity:1}}
.card-emoji{font-size:44px;line-height:1}
.card-title{font-size:19px;font-weight:900;margin:10px 0 18px}
.card-actions{display:flex;gap:10px}
.btn{
  flex:1;height:56px;border-radius:19px;font-size:18px;font-weight:900;
  display:flex;align-items:center;justify-content:center;transition:transform .1s;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#ff9d6b,#ff7b7b);color:#fff;box-shadow:var(--shadow)}
.btn.ghost{background:#f4f0fa;color:var(--ink-soft)}

/* 小精灵点评 */
#spriteBtn{
  position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%);
  z-index:55;height:52px;padding:0 22px;border-radius:99px;
  background:linear-gradient(135deg,#c86bff,#ff9ede);color:#fff;
  font-size:17px;font-weight:900;box-shadow:0 10px 26px rgba(155,92,255,.45);
  display:flex;align-items:center;gap:8px;animation:spriteFloat 1.6s ease-in-out infinite;
}
#spriteBtn:active{transform:translateX(-50%) scale(.95)}
@keyframes spriteFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
.sprite-emoji{font-size:44px;line-height:1;animation:spriteWiggle 1.2s ease-in-out infinite}
@keyframes spriteWiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
#spriteText{
  margin:12px 0 16px;padding:14px;min-height:88px;border-radius:18px;background:#fdf3ff;
  font-size:16.5px;font-weight:700;line-height:1.65;color:var(--ink);text-align:left;
}
#spriteText.loading{color:var(--ink-soft);text-align:center;display:flex;align-items:center;justify-content:center}

/* 我的作品页 */
.page{position:fixed;inset:0;background:linear-gradient(180deg,var(--bg),#fdf3ff);z-index:70;display:flex;flex-direction:column;touch-action:pan-y}
.page-head{
  flex:0 0 auto;height:calc(var(--topbar-h) + var(--safe-t));
  padding:var(--safe-t) 10px 0;display:flex;align-items:center;gap:8px;
}
.page-title{flex:1;text-align:center;font-size:20px;font-weight:900;color:var(--brand-2)}
.page-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px calc(24px + var(--safe-b))}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gal-item{position:relative;border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--shadow);aspect-ratio:3/4}
.gal-item img{width:100%;height:100%;object-fit:cover;display:block}
.gal-item:active{transform:scale(.96)}
.gal-del{
  position:absolute;right:4px;top:4px;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.92);color:#e8433a;font-size:17px;font-weight:900;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.16);z-index:2;
}
.gal-date{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10px;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent)}
.empty{text-align:center;color:var(--ink-soft);font-size:15px;padding:60px 20px;line-height:1.7}

/* 全屏模式 */
#fsbar{
  position:fixed;left:8px;right:8px;top:calc(8px + var(--safe-t));
  display:none;gap:6px;align-items:center;
  padding:6px;border-radius:22px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
  box-shadow:var(--shadow);z-index:30;
}
#fsbar button{
  flex:1;height:50px;border-radius:16px;background:#f7f3fd;
  font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;
}
#fsbar button:active{transform:scale(.92)}
#fsbar button[disabled]{opacity:.32}
body.fs #topbar,body.fs #toolbar{display:none}
body.fs #fsbar{display:flex}
body.fs #stage{margin:0;border-radius:0;box-shadow:none}
body.fs .panel{bottom:calc(6px + var(--safe-b));z-index:40}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:calc(var(--toolbar-h) + var(--safe-b) + 18px);
  transform:translateX(-50%) translateY(10px);
  background:rgba(74,50,100,.92);color:#fff;
  font-size:15px;font-weight:700;padding:11px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:80;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 小屏 */
@media (max-height:600px){
  :root{--toolbar-h:64px}
  .tab .tab-ic{font-size:21px}
  .tab{font-size:11px}
}
</style>
</head>
<body>

<!-- ===== 内联 SVG 图标库（全部自绘，零外部依赖，断网可用） ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

    <circle cx="7.8" cy="12.4" r="1.1"/><circle cx="9.9" cy="8.3" r="1.1"/><circle cx="14.4" cy="7.6" r="1.1"/>
  </symbol>
  <symbol id="i-brush" viewBox="0 0 24 24">

  </symbol>

    <path d="M21.5 20.5H7"/><path d="m5.2 11 8.8 8.8"/>
  </symbol>
  <symbol id="i-star" viewBox="0 0 24 24">
    <path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3.6Z"/>
  </symbol>
  <symbol id="i-shapes" viewBox="0 0 24 24">
    <circle cx="8.2" cy="8.2" r="4.3"/>
    <rect x="12.3" y="12.3" width="8.3" height="8.3" rx="2.2"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M4.5 6.5h15"/>
    <path d="M9.6 6.5V5A1.6 1.6 0 0 1 11.2 3.4h1.6A1.6 1.6 0 0 1 14.4 5v1.5"/>
    <path d="m6.6 6.5.9 12.1a2 2 0 0 0 2 1.9h5a2 2 0 0 0 2-1.9l.9-12.1"/>
    <path d="M10.4 10.4v6M13.6 10.4v6"/>
  </symbol>
  <symbol id="i-image" viewBox="0 0 24 24">
    <rect x="3.5" y="4.5" width="17" height="15" rx="3"/>
    <circle cx="9" cy="10" r="1.9"/>
    <path d="m4.9 17.7 4.3-4.3a2 2 0 0 1 2.8 0l4.5 4.5"/>
  </symbol>
  <symbol id="i-undo" viewBox="0 0 24 24">
    <path d="M4.6 8.4h9.1a5.8 5.8 0 0 1 0 11.6H7.6"/>
    <path d="m8.7 4.3-4.1 4.1 4.1 4.1"/>
  </symbol>
  <symbol id="i-redo" viewBox="0 0 24 24">
    <path d="M19.4 8.4h-9.1a5.8 5.8 0 0 0 0 11.6h6.1"/>
    <path d="m15.3 4.3 4.1 4.1-4.1 4.1"/>
  </symbol>
  <symbol id="i-save" viewBox="0 0 24 24">
    <path d="M12 3.8v10.5"/><path d="m7.7 10.2 4.3 4.3 4.3-4.3"/>
    <path d="M4.6 16.9v1.7a2.4 2.4 0 0 0 2.4 2.4h10a2.4 2.4 0 0 0 2.4-2.4v-1.7"/>
  </symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24">
    <path d="m6.5 10 5.5 5.5L17.5 10"/><path d="M4.6 19.6h14.8"/>
  </symbol>
  <symbol id="i-back" viewBox="0 0 24 24">
    <path d="M19 12H5.5"/><path d="m11 5.5-6.5 6.5 6.5 6.5"/>

  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>
  </symbol>
</defs></svg>

<div id="app">
  <!-- 顶栏 -->
  <header id="topbar">
    <button id="btnGallery" class="ic-btn" title="我的作品" aria-label="我的作品"><svg class="ic" viewBox="0 0 24 24"><use href="#i-image"/></svg></button>
    <div id="title">豆豆的画板</div>
    <div class="top-right">
      <button id="btnUndo" class="ic-btn" title="撤销" aria-label="撤销"><svg class="ic" viewBox="0 0 24 24"><use href="#i-undo"/></svg></button>
      <button id="btnRedo" class="ic-btn" title="重做" aria-label="重做"><svg class="ic" viewBox="0 0 24 24"><use href="#i-redo"/></svg></button>
      <button id="btnSave" class="ic-btn" title="保存" aria-label="保存"><svg class="ic" viewBox="0 0 24 24"><use href="#i-save"/></svg></button>
    </div>
  </header>

  <!-- 画布 -->
  <main id="stage">
    <canvas id="draw"></canvas>
    <canvas id="preview"></canvas>
    <div id="hint">👆 用手指画一画吧～</div>
  </main>

  <!-- 底部工具栏 -->
  <nav id="toolbar">
    <button class="tab" data-panel="color" id="tabColor" aria-label="颜色">
      <span class="tab-ic"><svg class="ic" viewBox="0 0 24 24"><use href="#i-palette"/></svg><span class="dot" id="tabColorDot"></span></span><span>颜色</span>
    </button>
    <button class="tab" data-panel="brush" id="tabBrush" aria-label="笔刷">
      <span class="tab-ic" id="tabBrushIc"><svg class="ic" viewBox="0 0 24 24"><use href="#i-brush"/></svg></span><span>笔刷</span>
    </button>
    <button class="tab" id="tabEraser" aria-label="橡皮">
      <span class="tab-ic"><svg class="ic" viewBox="0 0 24 24"><use href="#i-eraser"/></svg></span><span>橡皮</span>
    </button>
    <button class="tab" data-panel="sticker" id="tabSticker" aria-label="贴纸">
      <span class="tab-ic"><svg class="ic" viewBox="0 0 24 24"><use href="#i-star"/></svg></span><span>贴纸</span>
    </button>
    <button class="tab" data-panel="shape" id="tabShape" aria-label="图形">
      <span class="tab-ic"><svg class="ic" viewBox="0 0 24 24"><use href="#i-shapes"/></svg></span><span>图形</span>
    </button>
    <button class="tab danger" id="tabClear" aria-label="清空">
      <span class="tab-ic"><svg class="ic" viewBox="0 0 24 24"><use href="#i-trash"/></svg></span><span>清空</span>
    </button>
  </nav>
</div>

<!-- 面板：颜色 -->
<div class="panel hidden" id="panel-color">
  <div class="panel-head"><span>选一个颜色 🎨</span><button class="close-x" data-close>×</button></div>
  <div class="swatches" id="swatches"></div>
  <div class="panel-foot">
    <label class="more-color" for="colorPicker">🎨 更多颜色</label>
    <input type="color" id="colorPicker" value="#ff5c8a">
  </div>
</div>

<!-- 面板：笔刷 -->
<div class="panel hidden" id="panel-brush">
  <div class="panel-head"><span>选一支笔 ✏️</span><button class="close-x" data-close>×</button></div>
  <div class="grid-brush" id="brushGrid"></div>
  <div class="sub-title">笔粗</div>
  <div class="grid-size" id="sizeGrid"></div>
</div>

<!-- 面板：贴纸 -->
<div class="panel hidden" id="panel-sticker">
  <div class="panel-head"><span>选一个贴纸 ⭐</span><button class="close-x" data-close>×</button></div>

// 图形（全部矢量绘制；icon 是面板按钮上的 SVG 轮廓）
const SHAPES = [

  { id: "square",   name: "方形",   icon: '<rect x="3.6" y="3.6" width="16.8" height="16.8" rx="1.2"/>' },

  { id: "pentagon", name: "五边形", icon: '<path d="M12 3 20.5 9.2 17.3 19.3H6.7L3.5 9.2 12 3Z"/>' },
  { id: "hexagon",  name: "六边形", icon: '<path d="M12 2.8 20 7.4v9.2L12 21.2 4 16.6V7.4L12 2.8Z"/>' },
  { id: "star",     name: "五角星", icon: '<path d="m12 3.4 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6L3.2 9.8l6.1-.9L12 3.4Z"/>' },
  { id: "heart",    name: "爱心",   icon: '<path d="M12 20.6S3.6 15.2 3.6 9.4a4.75 4.75 0 0 1 8.4-2.9 4.75 4.75 0 0 1 8.4 2.9c0 5.8-8.4 11.2-8.4 11.2Z"/>' },
  { id: "drop",     name: "水滴",   icon: '<path d="M12 3c3.6 4.1 7 7.4 7 10.9a7 7 0 0 1-14 0C5 10.4 8.4 7.1 12 3Z"/>' },
  { id: "moon",     name: "月牙",   icon: '<path d="M20.4 14.9A9.1 9.1 0 0 1 9.1 3.6a9.1 9.1 0 1 0 11.3 11.3Z"/>' },
  { id: "cloud",    name: "云朵",   icon: '<path d="M7.2 18.4h9.4a3.9 3.9 0 0 0 .4-7.7 5.4 5.4 0 0 0-10.2 1.5 3.4 3.4 0 0 0 .4 6.2Z"/>' },
  { id: "flower",   name: "花朵",   icon: '<g><ellipse cx="12" cy="6.6" rx="2.5" ry="3.4"/><ellipse cx="12" cy="6.6" rx="2.5" ry="3.4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="6.6" rx="2.5" ry="3.4" transform="rotate(120 12 12)"/><ellipse cx="12" cy="6.6" rx="2.5" ry="3.4" transform="rotate(180 12 12)"/><ellipse cx="12" cy="6.6" rx="2.5" ry="3.4" transform="rotate(240 12 12)"/><ellipse cx="12" cy="6.6" rx="2.5" ry="3.4" transform="rotate(300 12 12)"/></g><circle cx="12" cy="12" r="2.4"/>' },
  { id: "bolt",     name: "闪电",   icon: '<path d="M13.6 2.8 6 13.3h4.9l-.9 7.9 8.1-10.9h-5.1l.6-7.5Z"/>' },
  { id: "cross",    name: "十字",   icon: '<path d="M9.6 3.3h4.8v6.3h6.3v4.8h-6.3v6.3H9.6v-6.3H3.3V9.6h6.3V3.3Z"/>' },
  { id: "arrow",    name: "箭头",   icon: '<path d="M3.4 9.2h8.1V4.8L20.6 12l-9.1 7.2v-4.4H3.4V9.2Z"/>' }
];

const LS_GALLERY = "kd_gallery_v1";   // 作品列表
const LS_CURRENT = "kd_current_v1";   // 当前画布（刷新后恢复）

// 全局状态
const state = {
  tool: "brush",        // brush | sticker
  shapeTool: false,     // 是否处于图形工具
  brush: "crayon",      // 当前笔刷
  color: "#2b2b2b",
  size: 7,
  shape: "circle",
  shapeFilled: false,
  sticker: "⭐",
  items: [],            // 所有绘制对象（矢量，可撤销/重画）
  history: [[]],        // 历史快照
  hIndex: 0
};

// 确定性随机数（同一 seed 必得同一序列，保证撤销重画后图案一致）
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// #rrggbb → rgba(...)
function rgba(hex, a) {
  let h = hex.replace("#", "");
  if (h.length === 3) h = h.split("").map(x => x + x).join("");
  const n = parseInt(h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/* ---------- ② 画布与渲染 ---------- */

const stage = $("stage");
const drawCanvas = $("draw");     // 主画布（透明底，白色由舞台/导出时填充）
const previewCanvas = $("preview"); // 预览层（形状、贴纸拖动）
const dctx = drawCanvas.getContext("2d");
const pctx = previewCanvas.getContext("2d");

let W = 0, H = 0, DPR = 1;        // 逻辑尺寸（CSS 像素）与像素比

// 适配屏幕 + 处理 devicePixelRatio，保证高清屏线条清晰
function setupCanvas(force) {
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width));
  const h = Math.max(1, Math.round(r.height));
  const oldW = W, oldH = H;
  const changed = force || Math.abs(w - W) > 2 || Math.abs(h - H) > 2;
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = w; H = h;

  for (const cv of [drawCanvas, previewCanvas]) {
    cv.width = Math.round(w * DPR);
    cv.height = Math.round(h * DPR);
    cv.style.width = w + "px";
    cv.style.height = h + "px";
    const cx = cv.getContext("2d");
    cx.setTransform(DPR, 0, 0, DPR, 0, 0); // 之后所有坐标都用 CSS 像素
  }
  // 尺寸变了（旋转屏幕等）：把已有内容按比例缩放，避免作品丢失
  if (changed && oldW > 0 && oldH > 0 && (oldW !== w || oldH !== h)) {
    rescaleItems(w / oldW, h / oldH);
  }
  redraw();
}

// 按比例缩放所有绘制对象
function rescaleItems(sx, sy) {
  const avg = (sx + sy) / 2;
  for (const it of state.items) {
    if (it.type === "stroke") {
      for (const p of it.points) { p.x *= sx; p.y *= sy; }
      if (it.cum) for (let i = 0; i < it.cum.length; i++) it.cum[i] *= avg;
      it.size *= avg;
      it.seed = (it.seed || 1) + 0.5;
    } else if (it.type === "sticker") {
      it.x *= sx; it.y *= sy; it.size *= avg;
    } else if (it.type === "shape") {
      it.x0 *= sx; it.y0 *= sy; it.x1 *= sx; it.y1 *= sy; it.size *= avg;
    }
  }
}

// 画一条线段
function lineTo(ctx, p0, p1) {
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  ctx.lineTo(p1.x, p1.y);
  ctx.stroke();
}

// 五角星路径
function starPath(ctx, cx, cy, r, points, inner, rot) {
  inner = inner === undefined ? 0.45 : inner;
  rot = rot === undefined ? -Math.PI / 2 : rot;
  for (let i = 0; i < points * 2; i++) {
    const rad = (i % 2 ? r * inner : r);
    const ang = rot + i * Math.PI / points;
    const x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

// 爱心路径
function heartPath(ctx, cx, cy, w, h) {
  const s = Math.max(8, Math.min(w, h));
  ctx.moveTo(cx, cy + s * 0.36);
  ctx.bezierCurveTo(cx + s * 0.52, cy - s * 0.14, cx + s * 0.26, cy - s * 0.56, cx, cy - s * 0.2);
  ctx.bezierCurveTo(cx - s * 0.26, cy - s * 0.56, cx - s * 0.52, cy - s * 0.14, cx, cy + s * 0.36);
  ctx.closePath();
}

// 绘制"一段"笔迹：points[i-1] → points[i]。每段独立 seed，保证重画完全一致
// 圆角矩形轮廓
function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// 正多边形（顶点朝上）
function polygonPath(ctx, cx, cy, r, n, rot) {
  const r0 = (rot === undefined) ? -Math.PI / 2 : rot;
  for (let i = 0; i < n; i++) {
    const a = r0 + i * Math.PI * 2 / n;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

// 水滴：上尖下圆
function dropPath(ctx, cx, cy, w, h) {
  const r = Math.min(w, h) / 2;
  const top = cy - h / 2;
  const byc = cy + h / 2 - r;
  ctx.moveTo(cx, top);
  ctx.quadraticCurveTo(cx, byc - r * 0.95, cx + r, byc);
  ctx.arc(cx, byc, r, 0, Math.PI, false);
  ctx.quadraticCurveTo(cx, byc - r * 0.95, cx, top);
  ctx.closePath();
}

// 月牙：外弧 + 内弧（端点严格重合，闭合时不会多出一条线）
function moonPath(ctx, cx, cy, r) {
  ctx.arc(cx, cy, r, -1.15, 1.15, false);
  ctx.arc(cx + r * 0.5, cy, r * 0.917, 1.671, -1.671, true);
  ctx.closePath();
}

// 云朵：一条连续的贝塞尔轮廓（左鼓包 → 顶部大鼓包 → 右鼓包 → 平底）
function cloudPath(ctx, cx, cy, w, h) {
  const x0 = cx - w / 2, y0 = cy - h / 2;
  const X = t => x0 + w * t, Y = t => y0 + h * t;
  ctx.moveTo(X(0.08), Y(0.93));
  ctx.bezierCurveTo(X(-0.05), Y(0.62), X(0.05), Y(0.27), X(0.25), Y(0.31));
  ctx.bezierCurveTo(X(0.29), Y(-0.05), X(0.61), Y(-0.05), X(0.65), Y(0.32));
  ctx.bezierCurveTo(X(0.84), Y(0.24), X(1.04), Y(0.56), X(0.91), Y(0.93));
  ctx.closePath();
}

// 花朵：五片花瓣 + 花心
function flowerPath(ctx, cx, cy, w, h) {
  const R = Math.min(w, h) / 2;
  const pr = R * 0.42, pd = R * 0.48;
  for (let i = 0; i < 5; i++) {
    const a = i * Math.PI * 2 / 5 - Math.PI / 2;
    const px = cx + Math.cos(a) * pd, py = cy + Math.sin(a) * pd;
    ctx.moveTo(px + pr, py);
    ctx.ellipse(px, py, pr, pr * 0.86, a, 0, Math.PI * 2);
  }
  ctx.moveTo(cx + R * 0.32, cy);
  ctx.arc(cx, cy, R * 0.32, 0, Math.PI * 2);
}

// 闪电
function boltPath(ctx, cx, cy, w, h) {
  const L = cx - w / 2, R = cx + w / 2, T = cy - h / 2, B = cy + h / 2;
  ctx.moveTo(cx + w * 0.12, T);
  ctx.lineTo(L + w * 0.06, cy + h * 0.06);
  ctx.lineTo(cx + w * 0.02, cy + h * 0.06);
  ctx.lineTo(cx - w * 0.12, B);
  ctx.lineTo(R - w * 0.06, cy - h * 0.10);
  ctx.lineTo(cx - w * 0.02, cy - h * 0.10);
  ctx.closePath();
}

// 十字
function crossPath(ctx, cx, cy, w, h) {
  const t = Math.min(w, h) * 0.34, ht = t / 2, hw = w / 2, hh = h / 2;
  ctx.moveTo(cx - ht, cy - hh);
  ctx.lineTo(cx + ht, cy - hh); ctx.lineTo(cx + ht, cy - ht);
  ctx.lineTo(cx + hw, cy - ht); ctx.lineTo(cx + hw, cy + ht);
  ctx.lineTo(cx + ht, cy + ht); ctx.lineTo(cx + ht, cy + hh);
  ctx.lineTo(cx - ht, cy + hh); ctx.lineTo(cx - ht, cy + ht);
  ctx.lineTo(cx - hw, cy + ht); ctx.lineTo(cx - hw, cy - ht);
  ctx.lineTo(cx - ht, cy - ht);
  ctx.closePath();
}

// 箭头（向右）
function arrowPath(ctx, cx, cy, w, h) {
  const t = Math.min(w, h) * 0.36, ht = t / 2, hw = w / 2, hh = h / 2;
  const nx = cx + hw * 0.10;
  ctx.moveTo(cx - hw, cy - ht);
  ctx.lineTo(nx, cy - ht); ctx.lineTo(nx, cy - hh);
  ctx.lineTo(cx + hw, cy); ctx.lineTo(nx, cy + hh);
  ctx.lineTo(nx, cy + ht); ctx.lineTo(cx - hw, cy + ht);
  ctx.closePath();
}

// 按 id 生成形状轮廓
function shapePath(ctx, id, cx, cy, w, h, x0, y0, x1, y1) {
  const L = Math.min(x0, x1), R = Math.max(x0, x1);
  const T = Math.min(y0, y1), B = Math.max(y0, y1);
  const m = Math.min(w, h);
  switch (id) {
    case "circle":   ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2); break;
    case "square":   ctx.rect(L, T, w, h); break;
    case "rect":     roundRectPath(ctx, L, T, w, h, m * 0.26); break;
    case "triangle": ctx.moveTo(cx, T); ctx.lineTo(R, B); ctx.lineTo(L, B); ctx.closePath(); break;
    case "diamond":  ctx.moveTo(cx, T); ctx.lineTo(R, cy); ctx.lineTo(cx, B); ctx.lineTo(L, cy); ctx.closePath(); break;
    case "pentagon": polygonPath(ctx, cx, cy, m / 2, 5); break;
    case "hexagon":  polygonPath(ctx, cx, cy, m / 2, 6); break;
    case "star":     starPath(ctx, cx, cy, m / 2, 5); break;
    case "heart":    heartPath(ctx, cx, cy, w, h); break;
    case "drop":     dropPath(ctx, cx, cy, w, h); break;
    case "moon":     moonPath(ctx, cx, cy, m / 2); break;
    case "cloud":    cloudPath(ctx, cx, cy, w, h); break;
    case "flower":   flowerPath(ctx, cx, cy, w, h); break;
    case "bolt":     boltPath(ctx, cx, cy, w, h); break;
    case "cross":    crossPath(ctx, cx, cy, w, h); break;
    case "arrow":    arrowPath(ctx, cx, cy, w, h); break;
    default:         ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
  }
}

function drawSeg(ctx, s, i) {
  const p0 = s.points[i - 1], p1 = s.points[i];
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  const d = Math.hypot(dx, dy) || 0.0001;
  const rng = mulberry32(((s.seed || 1) * 7919 + i * 131) | 0);
  const w = Math.max(1, s.size);
  const col = s.color;

  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";

  switch (s.brush) {
    // 橡皮：擦成透明，露出白色底
    case "eraser": {
      ctx.globalCompositeOperation = "destination-out";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = w * 2.2;
      lineTo(ctx, p0, p1);
      break;
    }
    // 铅笔：细实线
    case "pencil": {
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.95;
      ctx.lineWidth = w * 0.85;
      lineTo(ctx, p0, p1);
      break;
    }
    // 彩笔：粗实线，圆头
    case "marker": {
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.92;
      ctx.lineWidth = w * 1.25;
      lineTo(ctx, p0, p1);
      break;
    }
    // 荧光笔：很宽的半透明带
    case "highlighter": {
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = w * 2.6;
      lineTo(ctx, p0, p1);
      break;
    }
    // 蜡笔：底色 + 颗粒感
    case "crayon": {
      const cw = w * 1.35;
      ctx.strokeStyle = rgba(col, 0.5);
      ctx.lineWidth = cw;
      lineTo(ctx, p0, p1);
      ctx.fillStyle = rgba(col, 0.3);
      const n = clamp(Math.ceil(d / 2.5), 2, 24);
      for (let k = 0; k < n; k++) {
        const t = k / n;
        const jx = (rng() - 0.5) * cw * 0.95;
        const jy = (rng() - 0.5) * cw * 0.95;
        ctx.beginPath();
        ctx.arc(p0.x + dx * t + jx, p0.y + dy * t + jy, cw * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }
    // 彩虹笔：颜色随累计长度循环
    case "rainbow": {
      const dist = s.cum ? s.cum[i] : 0;
      const hue = (dist * 0.9) % 360;
      ctx.strokeStyle = `hsl(${hue},92%,56%)`;
      ctx.lineWidth = w * 1.2;
      lineTo(ctx, p0, p1);
      break;
    }
    // 星星笔：一路撒小星星
    case "star": {
      const n = clamp(Math.round(d / (w * 1.5)), 1, 10);
      for (let k = 0; k < n; k++) {
        const t = (k + 0.5) / n;
        const r = w * (0.7 + rng() * 0.6);
        ctx.fillStyle = `hsl(${Math.floor(rng() * 360)},88%,62%)`;
        ctx.beginPath();
        starPath(ctx, p0.x + dx * t, p0.y + dy * t, r, 5, 0.45, rng() * Math.PI);
        ctx.fill();
      }
      break;
    }
    // 泡泡笔：一路冒泡泡
    case "bubble": {
      const n = clamp(Math.round(d / (w * 1.1)), 1, 10);
      for (let k = 0; k < n; k++) {
        const t = (k + 0.5) / n;
        const r = w * (0.5 + rng() * 0.75);
        const cx = p0.x + dx * t + (rng() - 0.5) * w * 0.8;
        const cy = p0.y + dy * t + (rng() - 0.5) * w * 0.8;
        ctx.strokeStyle = rgba(col, 0.55);
        ctx.lineWidth = Math.max(1, w * 0.14);
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.55)";
        ctx.beginPath(); ctx.arc(cx - r * 0.32, cy - r * 0.34, r * 0.2, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
  }
  ctx.restore();
}

// 单点（手指点一下没移动）也要留下痕迹
function drawDot(ctx, s, p) {
  const tmp = { points: [{ x: p.x - 0.01, y: p.y - 0.01 }, { x: p.x + 0.01, y: p.y + 0.01 }], brush: s.brush, color: s.color, size: s.size, seed: s.seed, cum: [0, 0] };
  drawSeg(ctx, tmp, 1);
}

// 烟花：以某点为圆心的爆开效果（确定性随机，重画一致）
function drawFirework(ctx, it) {
  const rng = mulberry32(((it.seed || 1) * 104729) | 0);
  const R = it.size * 3.4;
  const n = Math.round(22 + rng() * 10);
  const baseHue = Math.floor(rng() * 360);
  ctx.save();
  ctx.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + rng() * 0.12;
    const len = R * (0.55 + rng() * 0.55);
    ctx.strokeStyle = `hsl(${(baseHue + i * 12) % 360},90%,58%)`;
    ctx.lineWidth = Math.max(1.4, it.size * 0.16);
    ctx.beginPath();
    ctx.moveTo(it.x + Math.cos(ang) * R * 0.1, it.y + Math.sin(ang) * R * 0.1);
    ctx.lineTo(it.x + Math.cos(ang) * len, it.y + Math.sin(ang) * len);
    ctx.stroke();
    ctx.fillStyle = `hsl(${(baseHue + i * 12 + 40) % 360},92%,66%)`;
    ctx.beginPath();
    ctx.arc(it.x + Math.cos(ang) * len, it.y + Math.sin(ang) * len, Math.max(1.5, it.size * 0.2), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.beginPath(); ctx.arc(it.x, it.y, Math.max(2, it.size * 0.3), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ---------- 自绘「彩虹小马」贴纸 ----------
   全部用 canvas 路径画出来：不依赖任何 emoji 字体，断网、换手机都是同一副样子。
   坐标统一归一化到 -0.5 ~ 0.5，绘制前按 size 缩放。 */
function drawPony(ctx, idx, size) {
  const n = PONIES.length;
  const P = PONIES[((idx % n) + n) % n];
  ctx.save();
  ctx.scale(size, size);
  ctx.translate(0.035, 0.045);   // 让画面在方框里视觉居中
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  // 尾巴
  ctx.strokeStyle = P.mane;
  ctx.lineWidth = 0.085;
  ctx.beginPath();
  ctx.moveTo(-0.28, -0.01);
  ctx.quadraticCurveTo(-0.47, 0.03, -0.42, 0.27);
  ctx.stroke();
  ctx.strokeStyle = P.mane2;
  ctx.lineWidth = 0.048;
  ctx.beginPath();
  ctx.moveTo(-0.29, 0.02);
  ctx.quadraticCurveTo(-0.44, 0.09, -0.37, 0.29);
  ctx.stroke();

  // 四条腿 + 蹄子
  ctx.strokeStyle = P.body;
  ctx.lineWidth = 0.088;
  const legs = [-0.21, -0.10, 0.04, 0.15];
  for (const x of legs) {
    ctx.beginPath(); ctx.moveTo(x, 0.14); ctx.lineTo(x, 0.40); ctx.stroke();
  }
  ctx.strokeStyle = P.hoof;
  for (const x of legs) {
    ctx.beginPath(); ctx.moveTo(x, 0.35); ctx.lineTo(x, 0.40); ctx.stroke();
  }

  // 身体、脖子、头
  ctx.fillStyle = P.body;
  ctx.beginPath(); ctx.ellipse(-0.05, 0.04, 0.28, 0.175, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0.10, -0.05, 0.135, 0.155, -0.30, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0.215, -0.175, 0.155, 0, Math.PI * 2); ctx.fill();

  // 耳朵
  ctx.beginPath();
  ctx.moveTo(0.115, -0.285);
  ctx.quadraticCurveTo(0.085, -0.435, 0.225, -0.375);
  ctx.closePath(); ctx.fill();

  // 独角（部分款式才有）
  if (P.horn) {
    ctx.fillStyle = "#ffd86b";
    ctx.beginPath();
    ctx.moveTo(0.165, -0.295);
    ctx.lineTo(0.205, -0.475);
    ctx.lineTo(0.255, -0.285);
    ctx.closePath(); ctx.fill();
  }

  // 口鼻
  ctx.fillStyle = "rgba(255,255,255,.62)";
  ctx.beginPath(); ctx.ellipse(0.325, -0.115, 0.072, 0.052, 0, 0, Math.PI * 2); ctx.fill();

  // 鬃毛（盖在头上，像刘海）
  ctx.strokeStyle = P.mane;
  ctx.lineWidth = 0.105;
  ctx.beginPath();
  ctx.moveTo(0.115, -0.315);
  ctx.quadraticCurveTo(-0.02, -0.17, 0.005, 0.07);
  ctx.stroke();
  ctx.strokeStyle = P.mane2;
  ctx.lineWidth = 0.058;
  ctx.beginPath();
  ctx.moveTo(0.175, -0.30);
  ctx.quadraticCurveTo(0.055, -0.13, 0.075, 0.09);
  ctx.stroke();

  // 眼睛（带高光）
  ctx.fillStyle = "#3b2c4a";
  ctx.beginPath(); ctx.arc(0.255, -0.19, 0.038, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(0.268, -0.203, 0.014, 0, Math.PI * 2); ctx.fill();

  // 腮红
  ctx.fillStyle = "rgba(255,120,170,.34)";
  ctx.beginPath(); ctx.ellipse(0.20, -0.075, 0.045, 0.028, 0, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// 小马贴纸在面板里的缩略图（离屏画一次后缓存成 dataURL）
const ponyThumbCache = {};
function ponyThumb(idx) {
  if (ponyThumbCache[idx]) return ponyThumbCache[idx];
  const px = 44, dpr = 2;
  const cv = document.createElement("canvas");
  cv.width = px * dpr; cv.height = px * dpr;
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.translate(px / 2, px / 2);
  drawPony(c, idx, px * 0.98);
  const url = cv.toDataURL();
  ponyThumbCache[idx] = url;
  return url;
}

// 渲染一个绘制对象
function renderItem(ctx, it) {
  if (it.hidden) return;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";

  if (it.type === "stroke") {
    if (it.brush === "firework") { drawFirework(ctx, it); ctx.restore(); return; }
    ctx.restore();
    if (it.points.length === 1) { drawDot(ctx, it, it.points[0]); return; }
    for (let i = 1; i < it.points.length; i++) drawSeg(ctx, it, i);
    return;
  }

  if (it.type === "sticker") {
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot || 0);
    if (it.emoji.charAt(0) === "#") {
      // 自绘矢量贴纸（#ponyN）
      drawPony(ctx, parseInt(it.emoji.slice(5), 10) || 0, it.size);
    } else {
      ctx.font = it.size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(it.emoji, 0, 0);
    }
    ctx.restore();
    return;
  }

  if (it.type === "shape") {
    const x0 = it.x0, y0 = it.y0, x1 = it.x1, y1 = it.y1;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const w = Math.max(1, Math.abs(x1 - x0)), h = Math.max(1, Math.abs(y1 - y0));
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = it.color;
    ctx.fillStyle = it.color;
    ctx.lineWidth = Math.max(2, it.size * 0.75);
    ctx.beginPath();
    shapePath(ctx, it.shape, cx, cy, w, h, x0, y0, x1, y1);
    if (it.filled) { ctx.fill(); ctx.lineWidth = Math.max(1.5, it.size * 0.4); ctx.stroke(); }
    else ctx.stroke();
    ctx.restore();
    return;
  }
  ctx.restore();
}

// 全量重画（撤销 / 重做 / 屏幕变化时调用）
function redraw() {
  dctx.save();
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  dctx.clearRect(0, 0, W, H);
  dctx.globalAlpha = 1;
  dctx.globalCompositeOperation = "source-over";
  for (const it of state.items) renderItem(dctx, it);
  dctx.restore();
  updateSpriteBtn();
}

// 清空预览层
function clearPreview() {
  pctx.save();
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  pctx.clearRect(0, 0, W, H);
  pctx.restore();
}
/* ---------- ③ 历史记录与指针交互 ---------- */

const MAX_HISTORY = 60;

// 记录一步历史（每次完成一个动作后调用）
function pushHistory() {
  state.history = state.history.slice(0, state.hIndex + 1);
  state.history.push(state.items.slice());
  if (state.history.length > MAX_HISTORY) state.history.shift();
  state.hIndex = state.history.length - 1;
  updateHistoryButtons();
  persistCurrent();
}

function restoreHistory() {
  state.items = state.history[state.hIndex].slice();
  redraw();
  updateHistoryButtons();
  persistCurrent();
}

function undo() {
  if (state.hIndex <= 0) { toast("没有可以撤销的啦"); return; }
  state.hIndex--;
  restoreHistory();
}
function redo() {
  if (state.hIndex >= state.history.length - 1) { toast("没有可以重做的啦"); return; }
  state.hIndex++;
  restoreHistory();
}
function updateHistoryButtons() {
  const u = $("btnUndo"), r = $("btnRedo");
  u.disabled = state.hIndex <= 0;
  r.disabled = state.hIndex >= state.history.length - 1;
  $("fsUndo").disabled = u.disabled;
  $("fsRedo").disabled = r.disabled;
}

// 坐标换算：屏幕坐标 → 画布逻辑坐标
function pos(e) {
  const r = drawCanvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

const pointers = new Map();   // pointerId → {x,y}
let stroke = null;            // 正在画的笔迹
let shapeStart = null;        // 正在拖的图形起点
let dragSticker = null;       // 正在拖的贴纸
let dragInfo = null;          // 贴纸拖动/缩放/旋转的起始数据

/* ===== 贴纸操作 =====
   设计要点：
   1) 不论当前用的是哪个工具，手指按在贴纸上就是「抓起来移动」——
      小朋友画到一半想挪贴纸，不用先切回贴纸面板。
   2) 双指缩放/旋转以「第二根手指落下那一刻」为基准，全程不跳；
      中途松开一根手指，剩下的无缝接管。
   3) 移动渲染用 requestAnimationFrame 合并，避免高刷屏重复绘制。
   4) 松手时把贴纸收在画布范围内，保证下一次一定还抓得到。 */
const GRAB_MIN = 18;          // 最小抓取半径（小朋友手指没那么准）
const MOVE_EPS = 4;           // 小于这个位移不算"移动过"，不写历史，避免垃圾记录
let stickerRaf = 0;           // rAF 句柄
let stickerTipShown = false;  // 贴第一张贴纸时才提示

// 找出手指下方的贴纸：最上面的优先；做了反旋转，转过的贴纸也点得准
function hitSticker(p) {
  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];
    if (it.type !== "sticker") continue;
    const dx = p.x - it.x, dy = p.y - it.y;
    const rot = it.rot || 0;
    const cs = Math.cos(-rot), sn = Math.sin(-rot);
    const lx = dx * cs - dy * sn, ly = dx * sn + dy * cs;   // 反旋转到贴纸自身坐标
    const loose = (state.tool === "sticker");               // 贴纸模式下判定放宽
    const ry = Math.max(it.size * (loose ? 0.62 : 0.46), GRAB_MIN);
    const rx = ry * 1.25;                                   // 自绘小马横向更长，命中框跟着放宽
    if ((lx * lx) / (rx * rx) + (ly * ly) / (ry * ry) <= 1) return it;
  }
  return null;
}

// 把正在拖的贴纸画到预览层：略微抬起 + 柔光圈，让小朋友看到"抓起来了"
function paintStickerPreview(it) {
  clearPreview();
  pctx.save();
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  pctx.beginPath();
  pctx.arc(it.x, it.y, it.size * 0.66, 0, Math.PI * 2);
  pctx.fillStyle = "rgba(255,255,255,.45)";
  pctx.fill();
  pctx.setLineDash([7, 6]);
  pctx.strokeStyle = "rgba(150,120,200,.55)";
  pctx.lineWidth = 1.6;
  pctx.stroke();
  pctx.restore();
  // 渲染时临时放开 hidden（renderItem 会跳过隐藏对象），画完还原
  const real = it.size, hid = it.hidden;
  it.size = real * 1.06;      // 抬起来一点点
  it.hidden = false;
  renderItem(pctx, it);
  it.hidden = hid;
  it.size = real;
}

// 合并渲染：一帧最多画一次，高刷屏上也不会画多余的东西
function scheduleStickerPaint() {
  if (stickerRaf) return;
  stickerRaf = requestAnimationFrame(() => {
    stickerRaf = 0;
    if (dragSticker) paintStickerPreview(dragSticker);
  });
}

// 开始拖动某个贴纸
function beginStickerDrag(it, p, pointerId, isNew) {
  it.hidden = true;
  redraw();                   // 从主画布撤下来，改由预览层跟着手指走
  paintStickerPreview(it);
  dragSticker = it;
  dragInfo = {
    pointerId,
    isNew,
    ox: p.x - it.x, oy: p.y - it.y,      // 单指：保持手指与贴纸的相对位置
    mid0: null, x0: 0, y0: 0,            // 双指：基准中点 / 基准位置
    d0: 0, a0: 0, s0: it.size, r0: it.rot || 0,
    dist: 0,                              // 累计位移
    moved: !!isNew                        // 新贴的一定记历史
  };
}

// 主手指松开但还有别的手指按着：换它接管，位置不跳
function handOverDrag() {
  if (!dragSticker || !dragInfo) return;
  const id = [...pointers.keys()][0];
  const q = [...pointers.values()][0];
  if (id === undefined || !q) { settleStickerDrag(); return; }
  dragInfo.pointerId = id;
  dragInfo.ox = q.x - dragSticker.x;
  dragInfo.oy = q.y - dragSticker.y;
  dragInfo.d0 = 0;
}

// 松手落定：收在画布范围内
function settleStickerDrag() {
  if (!dragSticker) return;
  const it = dragSticker;
  const pad = it.size * 0.1;
  it.x = clamp(it.x, -pad, W + pad);
  it.y = clamp(it.y, -pad, H + pad);
  it.hidden = false;
  clearPreview();
  // 必须重画：贴纸在拖动开始时已从主画布撤下，这里要把它画回新位置。
  // （少了这一步就会出现"拖完松手贴纸不见了"）
  redraw();
  if (dragInfo && dragInfo.moved) pushHistory();   // 只是点了一下没动，不写历史
  dragSticker = null;
  dragInfo = null;
}

// 手指按下
function onPointerDown(e) {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  // 多点触控：第二根手指只在"贴纸缩放旋转"时参与，避免误画
  if (pointers.size >= 1 && !dragSticker) return;
  const p = pos(e);
  pointers.set(e.pointerId, p);
  try { drawCanvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  hideHint();

  // 已有拖动进行中：第二根手指只参与缩放/旋转，不重新开始动作。
  // 必须在这里就把基准算好 —— 放到第一次 move 再取，取到的是"已经拉开之后"的距离，
  // 缩放就会失效（表现为双指怎么拉贴纸都不变大）。
  if (dragSticker && dragInfo) {
    const main = pointers.get(dragInfo.pointerId);
    if (main) {
      dragInfo.d0 = Math.hypot(p.x - main.x, p.y - main.y) || 1;
      dragInfo.a0 = Math.atan2(p.y - main.y, p.x - main.x);
      dragInfo.mid0 = { x: (p.x + main.x) / 2, y: (p.y + main.y) / 2 };
      dragInfo.s0 = dragSticker.size;
      dragInfo.r0 = dragSticker.rot || 0;
      dragInfo.x0 = dragSticker.x;
      dragInfo.y0 = dragSticker.y;
    } else {
      dragInfo.d0 = 0;
    }
    return;
  }

  // (1) 贴纸：无论现在拿着什么工具，按在贴纸上就是抓起来移动
  const grabbed = hitSticker(p);
  if (grabbed) {
    beginStickerDrag(grabbed, p, e.pointerId, false);
    return;
  }

  // (2) 贴纸模式下点空白 = 贴一个新的，并且立刻就能拖走
  if (state.tool === "sticker") {
    const target = {
      type: "sticker",
      emoji: state.sticker,
      x: p.x, y: p.y,
      size: clamp(state.size * 9, 44, 180),
      rot: 0
    };
    state.items.push(target);
    beginStickerDrag(target, p, e.pointerId, true);
    if (!stickerTipShown) { stickerTipShown = true; toast("贴好啦，按住就能拖走～"); }
    return;
  }

  // (2) 图形模式
  if (state.shapeTool) {
    shapeStart = p;
    return;
  }

  // (3) 自由绘画
  const it = {
    type: "stroke",
    brush: state.brush,
    color: state.color,
    size: state.size,
    seed: Math.floor(Math.random() * 1e6) + 1,
    points: [p],
    cum: [0]
  };
  if (state.brush === "firework") {   // 烟花：点一下直接爆开
    state.items.push(it);
    renderItem(dctx, it);
    pushHistory();
    stroke = null;
    return;
  }
  stroke = it;
  state.items.push(it);
}

// 手指移动
function onPointerMove(e) {
  const p = pos(e);
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  pointers.set(e.pointerId, p);

  // 贴纸：单指移动 / 双指放大·转动
  if (dragSticker && dragInfo) {
    const it = dragSticker;
    const others = [...pointers.entries()].filter(([id]) => id !== e.pointerId).map(([, q]) => q);
    const s2 = others[0];
    if (s2) {
      // 双指：以「第二根手指落下的那一刻」为基准，缩放和转动都不会跳
      const dist = Math.hypot(s2.x - p.x, s2.y - p.y) || 1;
      // 角度参考系要和「第二指按下那一刻」保持一致（同为 自己-对方），
      // 否则旋转方向会反过来：双指顺时针转，贴纸逆时针转
      const ang = Math.atan2(p.y - s2.y, p.x - s2.x);
      const mid = { x: (p.x + s2.x) / 2, y: (p.y + s2.y) / 2 };
      if (!dragInfo.d0) {
        dragInfo.d0 = dist;
        dragInfo.a0 = ang;
        dragInfo.s0 = it.size;
        dragInfo.r0 = it.rot || 0;
        dragInfo.mid0 = mid;
        dragInfo.x0 = it.x;
        dragInfo.y0 = it.y;
      }
      it.size = clamp(dragInfo.s0 * (dist / dragInfo.d0), 20, 420);
      it.rot = dragInfo.r0 + (ang - dragInfo.a0);
      it.x = dragInfo.x0 + (mid.x - dragInfo.mid0.x);
      it.y = dragInfo.y0 + (mid.y - dragInfo.mid0.y);
      dragInfo.ox = p.x - it.x;   // 为「松开一根手指继续拖」做准备
      dragInfo.oy = p.y - it.y;
      dragInfo.dist = MOVE_EPS + 1;   // 用了双指，算作有效改动
    } else {
      const nx = p.x - dragInfo.ox, ny = p.y - dragInfo.oy;
      dragInfo.dist += Math.hypot(nx - it.x, ny - it.y);
      it.x = nx; it.y = ny;
    }
    if (dragInfo.dist > MOVE_EPS) dragInfo.moved = true;
    scheduleStickerPaint();
    return;
  }

  // 图形：拖动预览
  if (shapeStart) {
    const it = {
      type: "shape", shape: state.shape, color: state.color,
      size: state.size, filled: state.shapeFilled,
      x0: shapeStart.x, y0: shapeStart.y, x1: p.x, y1: p.y
    };
    clearPreview();
    renderItem(pctx, it);
    return;
  }

  // 自由绘画：追加点 + 只画新增的一段（流畅、不断线）
  if (!stroke) return;
  const pts = stroke.points;
  const last = pts[pts.length - 1];
  const batch = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  for (const ev of batch) {
    const q = pos(ev);
    const d = Math.hypot(q.x - last.x, q.y - last.y);
    if (d < 0.7) continue;              // 过滤抖动，减少节点
    pts.push(q);
    stroke.cum.push(stroke.cum[stroke.cum.length - 1] + d);
    drawSeg(dctx, stroke, pts.length - 1);
    last.x = q.x; last.y = q.y;
  }
}

// 手指抬起
function onPointerUp(e) {
  pointers.delete(e.pointerId);
  try { drawCanvas.releasePointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }

  // 还有别的手指按着 → 换它接管，拖动继续，位置不跳
  if (dragSticker && dragInfo && pointers.size > 0) { handOverDrag(); return; }
  // 贴纸落定
  if (dragSticker && dragInfo) {
    settleStickerDrag();
    return;
  }

  // 图形落定
  if (shapeStart) {
    const p = pointers.size ? [...pointers.values()][0] : pos(e);
    const w = Math.abs(p.x - shapeStart.x), h = Math.abs(p.y - shapeStart.y);
    clearPreview();
    if (w > 6 || h > 6) {   // 太小忽略，避免误触画出小点
      const it = {
        type: "shape", shape: state.shape, color: state.color,
        size: state.size, filled: state.shapeFilled,
        x0: shapeStart.x, y0: shapeStart.y, x1: p.x, y1: p.y
      };
      state.items.push(it);
      renderItem(dctx, it);
      pushHistory();
    }
    shapeStart = null;
    return;
  }

  // 笔迹落定
  if (stroke) {
    const pts = stroke.points;
    if (pts.length < 2) drawDot(dctx, stroke, pts[0]);
    stroke = null;
    pushHistory();
  }
}

// 指针取消 / 移出
function onPointerCancel(e) {
  pointers.delete(e.pointerId);
  if (dragSticker) {
    if (pointers.size > 0) handOverDrag(); else settleStickerDrag();
  }
  if (shapeStart) { shapeStart = null; clearPreview(); }
  if (stroke) {
    const pts = stroke.points;
    if (pts.length < 2) drawDot(dctx, stroke, pts[0]);
    stroke = null;
    pushHistory();
  }
}

drawCanvas.addEventListener("pointerdown", onPointerDown, { passive: false });
drawCanvas.addEventListener("pointermove", onPointerMove, { passive: false });
drawCanvas.addEventListener("pointerup", onPointerUp, { passive: false });
drawCanvas.addEventListener("pointercancel", onPointerCancel, { passive: false });
drawCanvas.addEventListener("contextmenu", e => e.preventDefault());
// 兜底：阻止 iOS 上的双指缩放与滚动
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("touchmove", e => {

}, { passive: false });

}
function markTabs(active) {
  const cur = active === undefined ? null : active;
  $("tabColor").classList.toggle("on", cur === "color");
  $("tabBrush").classList.toggle("on", cur === "brush" || (state.tool === "brush" && !state.shapeTool && state.brush !== "eraser"));

  $("tabShape").classList.toggle("on", cur === "shape" || state.shapeTool);
}

  btn.addEventListener("click", () => {

    if (panel) {
      const isOpen = !$("panel-" + panel).classList.contains("hidden");
      if (isOpen) { closePanels(); }
      else {

        if (panel === "sticker") state.tool = "sticker", state.shapeTool = false;
        else if (panel === "shape") state.shapeTool = true, state.tool = "brush";

// 生成导出用的画布（白底 + 内容），返回 canvas
function composeCanvas(maxWidth) {
  const scale = maxWidth ? Math.min(1, maxWidth / W) : 1;
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(W * DPR * scale));
  cv.height = Math.max(1, Math.round(H * DPR * scale));
  const cx = cv.getContext("2d");
  cx.fillStyle = "#ffffff";             // 背景白色
  cx.fillRect(0, 0, cv.width, cv.height);
  cx.drawImage(drawCanvas, 0, 0, cv.width, cv.height);
  return cv;
}

// 保存：导出 PNG → 触发下载 → 存入"我的作品"
function savePng() {
  closePanels();
  if (!state.items.length) { toast("先画点什么再保存吧 😊"); return; }
  let url = "";
  try {
    url = composeCanvas(null).toDataURL("image/png");
  } catch (err) {
    toast("保存失败，请再试一次");
    return;
  }
  // 触发下载（老版本 iOS 不支持 download 时，改为打开图片让用户长按保存）
  const name = `豆豆的画板_${todayStr()}.png`;
  try {
    const a = document.createElement("a");
    a.href = url;
    a.rel = "noopener";
    if ("download" in a) {
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 500);
    } else {
      const w = window.open(url, "_blank");
      if (!w) toast("长按图片可以保存到相册哦");
    }
  } catch (err) { /* 少数浏览器禁止下载，作品已存进"我的作品" */ }

  // 存进作品列表（缩略图 + 矢量数据）
  const thumb = composeCanvas(360).toDataURL("image/jpeg", 0.72);
  saveToGallery(thumb);
  toast("保存好啦 💾 " + name);
}

function readGallery() {
  try { return JSON.parse(localStorage.getItem(LS_GALLERY) || "[]"); } catch (e) { return []; }
}
function writeGallery(list) {
  try { localStorage.setItem(LS_GALLERY, JSON.stringify(list)); return true; }
  catch (e) { return false; }
}

function saveToGallery(thumb) {
  const list = readGallery();
  const item = {
    id: "d" + Date.now(),
    ts: Date.now(),
    date: todayStr(),
    thumb: thumb,
    items: JSON.stringify(state.items)
  };
  list.unshift(item);
  // 最多保留 24 张，超了删最旧的
  while (list.length > 24) list.pop();
  // 存储超限时逐张丢弃最旧的再试
  let guard = 0;
  while (!writeGallery(list) && list.length > 1 && guard++ < 30) list.pop();
  renderGallery();
}

function renderGallery() {
  const list = readGallery();
  const grid = $("galGrid");
  grid.innerHTML = "";
  $("galEmpty").classList.toggle("hidden", list.length > 0);
  list.forEach(it => {
    const div = document.createElement("div");
    div.className = "gal-item";
    const img = document.createElement("img");
    img.src = it.thumb;
    img.alt = "豆豆的画板";
    const del = document.createElement("button");
    del.className = "gal-del";
    del.textContent = "✕";
    del.addEventListener("click", ev => {
      ev.stopPropagation();
      confirmDialog("要删掉这张画吗？", "删掉", "🗑️", () => {
        const l = readGallery().filter(x => x.id !== it.id);
        writeGallery(l);
        renderGallery();
        toast("删掉啦");
      });
    });
    const date = document.createElement("div");
    date.className = "gal-date";
    date.textContent = it.date || "";
    div.appendChild(img);
    div.appendChild(date);
    div.appendChild(del);
    div.addEventListener("click", () => openArtwork(it));
    grid.appendChild(div);
  });
}

// 打开作品继续编辑
function openArtwork(it) {
  let items = [];
  try { items = JSON.parse(it.items || "[]"); } catch (e) { items = []; }
  if (!items.length) { toast("这张画只能看，不能再改啦"); return; }
  confirmDialog("要继续画这张吗？", "继续画", "🖌️", () => {
    state.items = items;
    state.history = [items.slice()];
    state.hIndex = 0;
    redraw();
    updateHistoryButtons();
    persistCurrent();
    hideHint();
    closeGallery();
    toast("继续画吧 ✨");
  });
}

// —— 全屏模式 ——
let fsOn = false;
function setFs(on) {
  fsOn = on;
  document.body.classList.toggle("fs", on);
  setTimeout(() => setupCanvas(true), 120);
  if (on) {
    const el = document.documentElement;
    try {
      if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (e) { /* iOS 不支持也仍进入沉浸模式 */ }
    toast("全屏画画模式 ⭐");
  } else {
    try {
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
      else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (e) { /* 忽略 */ }
    toast("退出全屏啦");
  }
}
// 双击舞台进入全屏不方便（会误触），改为长按画布空白？不合适——用工具条上的按钮
// 说明：进入全屏的入口放在"图形/颜色"面板以外，避免干扰画画，这里用标题双击 + 提示按钮
$("title").addEventListener("dblclick", () => setFs(!fsOn));
$("fsExit").addEventListener("click", () => setFs(false));
$("fsColor").addEventListener("click", () => {
  const isOpen = !$("panel-color").classList.contains("hidden");
  if (isOpen) closePanels(); else openPanel("color");
});
$("fsEraser").addEventListener("click", () => { closePanels(); if (state.brush === "eraser") setBrush("crayon"); else setBrush("eraser"); });
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && fsOn) setFs(false);
});

// —— 作品持久化：当前画布 ——
let persistTimer = null;
// 立即写入（离开页面 / 切到后台时调用，避免丢画）
function writeCurrentNow() {
  clearTimeout(persistTimer);
  try {
    const data = JSON.stringify(state.items);
    if (data.length < 900000) localStorage.setItem(LS_CURRENT, data);
  } catch (e) { /* 存储满则忽略 */ }
}
// 延迟写入（连续画画时避免频繁操作 localStorage）
function persistCurrent() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(writeCurrentNow, 600);
}
window.addEventListener("pagehide", writeCurrentNow);
window.addEventListener("beforeunload", writeCurrentNow);
document.addEventListener("visibilitychange", () => { if (document.hidden) writeCurrentNow(); });
function restoreCurrent() {
  try {
    const raw = localStorage.getItem(LS_CURRENT);
    if (!raw) return false;
    const items = JSON.parse(raw);
    if (!Array.isArray(items) || !items.length) return false;
    state.items = items;
    state.history = [items.slice()];
    state.hIndex = 0;
    return true;
  } catch (e) { return false; }
}

// —— 屏幕尺寸变化（旋转 / 键盘弹出） ——
let resizeTimer = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => setupCanvas(false), 150);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", () => setTimeout(onResize, 260));
if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);

// —— 初始化 ——
function init() {
  buildSwatches();
  buildBrushes();
  buildSizes();
  buildStickers();
  buildShapes();

  // 默认：蜡笔 + 黑色 + 中号
  state.brush = "crayon";
  state.color = "#2b2b2b";
  state.size = 7;
  markColor(); markBrush(); markSizes(); markTabs(null);

  const restored = restoreCurrent();
  setupCanvas(true);
  if (restored) {
    redraw();
    hideHint();
  } else {
    redraw();
  }
  updateHistoryButtons();
  renderGallery();

  // 进入全屏的入口提示（长按标题 0.6 秒）
  let pressTimer = null;
  $("title").addEventListener("pointerdown", () => { pressTimer = setTimeout(() => setFs(true), 600); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
    $("title").addEventListener(ev, () => clearTimeout(pressTimer)));
  $("title").title = "长按进入全屏画画模式";
}

// 防止页面被拖动/缩放（不影响上面的画布事件）
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
document.addEventListener("touchstart", e => {
  if (e.touches.length > 1 && e.target.closest && e.target.closest("#stage")) e.preventDefault();
}, { passive: false });

/* ---------- ⑥ 小精灵点评（AI，联网增强功能，断网自动降级本地夸夸） ---------- */

// 贴纸中文名（键与 STICKERS 完全一致；"#ponyN" 走 PONY_NAMES）
const STICKER_NAMES = {
  "🐱":"小猫","🐶":"小狗","🐰":"兔子","🐼":"熊猫","🐨":"考拉","🦊":"狐狸","🐯":"老虎","🐷":"小猪","🐸":"青蛙","🐵":"猴子",
  "⭐":"星星","🌈":"彩虹","❤️":"爱心","🌸":"樱花","🌻":"向日葵","🍀":"四叶草","☀️":"太阳","🌙":"月亮","❄️":"雪花",
  "🍎":"苹果","🍓":"草莓","🍉":"西瓜","🍌":"香蕉","🍇":"葡萄","🍊":"橘子","🍰":"蛋糕","🍭":"棒棒糖","🍦":"冰淇淋","🍩":"甜甜圈",
  "🎈":"气球","🎁":"礼物","🎀":"蝴蝶结","👑":"皇冠","🚗":"小汽车","🚀":"火箭","⚽":"足球","🦄":"独角兽","🐝":"小蜜蜂","🦋":"蝴蝶"
};
const PONY_NAMES = ["粉色小马","蓝色小马","黄色小马","绿色小马","紫色独角小马","粉色独角小马"];

function colorName(hex) {
  const f = COLORS.find(c => c.c.toLowerCase() === String(hex || "").toLowerCase());
  return f ? f.n + "色" : "";
}

// 把当前画作整理成文字描述（给大模型看的"画的内容"）
function describeArtwork() {
  const stickerCount = {}, shapeCount = {};
  const strokeColors = new Set(), funBrushes = new Set();
  let strokeN = 0;
  state.items.forEach(it => {
    if (it.type === "sticker") {
      let name = "小贴纸";
      if (String(it.emoji).charAt(0) === "#") name = PONY_NAMES[+String(it.emoji).slice(5)] || "彩虹小马";
      else if (STICKER_NAMES[it.emoji]) name = STICKER_NAMES[it.emoji];
      stickerCount[name] = (stickerCount[name] || 0) + 1;
    } else if (it.type === "shape") {
      const sh = SHAPES.find(s => s.id === it.shape);
      const cn = colorName(it.color);
      const name = (cn ? cn + "的" : "") + (sh ? sh.name : "图形");
      shapeCount[name] = (shapeCount[name] || 0) + 1;
    } else if (it.type === "stroke") {
      if (it.brush !== "eraser") {
        strokeN++;
        const cn = colorName(it.color);
        if (cn) strokeColors.add(cn);
        if (it.brush === "rainbow") funBrushes.add("彩虹笔");
        else if (it.brush === "star") funBrushes.add("星星笔");
        else if (it.brush === "bubble") funBrushes.add("泡泡笔");
        else if (it.brush === "firework") funBrushes.add("烟花笔");
      }
    }
  });
  const expand = obj => Object.entries(obj).map(([n, c]) => c > 1 ? c + "个" + n : n);
  const parts = [];
  const stickers = expand(stickerCount), shapes = expand(shapeCount);
  if (stickers.length) parts.push("贴着" + stickers.join("、"));
  if (shapes.length) parts.push("画着" + shapes.join("、"));
  if (strokeN) {
    const cs = [...strokeColors].slice(0, 5);
    parts.push("用" + (cs.length ? cs.join("、") : "彩色") + "的笔画了" + strokeN + "笔" +
      (funBrushes.size ? "，还用了" + [...funBrushes].join("、") : ""));
  }
  return {
    text: parts.join("；") || "一幅刚刚开始的画",
    stickers: Object.keys(stickerCount),
    colors: [...strokeColors]
  };
}

// 断网 / 接口不可用时的本地夸夸（也用真实画面内容，不敷衍）
function localPraise(info) {
  const thing = info.stickers[0] || "这幅画";
  const thing2 = info.stickers[1] || info.stickers[0] || "小画家";
  const color = info.colors[0] || "彩虹色";
  const pool = [
    `哇——${thing}！它正在画里咕噜咕噜冒着彩色泡泡开派对呢～豆豆的${color}用得太好看啦，${thing}悄悄告诉我，它最最最喜欢你哦！🌈✨ 你说，它今晚会不会梦见你呀？`,
    `天呐！${thing}和${thing2}在画里手拉手转圈圈，嘚嘚嘚，转得我都晕啦！豆豆选的颜色像糖果一样甜～🍭 你猜它们转完圈要去哪里冒险？`,
    `哇塞，${thing}从画里探出小脑袋跟我打招呼啦！它说豆豆是世界上最会画画的小魔法师，噼里啪啦变出这么多好看的颜色！🪄 下次能不能给它画个小伙伴呀？`
  ];
  return pool[Math.floor(Math.random() * pool.length)];
}

// —— 常驻入口按钮：画布上有内容就一直在，清空或撤销到空白时才消失 ——
function updateSpriteBtn() {
  $("spriteBtn").classList.toggle("hidden", state.items.length === 0);
}

// —— 点评弹窗 ——
let spriteInfo = null;      // 当前画作的描述信息
let spriteLastText = "";    // 最近一次点评（供朗读 / 重听）
let typeTimer = null;
let spriteFetchCtrl = null;

function openSpriteModal() {
  spriteInfo = describeArtwork();
  $("spriteModal").classList.remove("hidden");
  requestSpriteReview(false);
}
function closeSpriteModal() {
  $("spriteModal").classList.add("hidden");
  stopSpriteWork();
}
function stopSpriteWork() {
  clearInterval(typeTimer);
  if (spriteFetchCtrl) { try { spriteFetchCtrl.abort(); } catch (e) {} spriteFetchCtrl = null; }
}

// 打字机效果把点评写出来
function typewriteSprite(text) {
  clearInterval(typeTimer);
  spriteLastText = text;
  const box = $("spriteText");
  box.classList.remove("loading");
  box.textContent = "";
  let i = 0;
  typeTimer = setInterval(() => {
    i++;
    box.textContent = text.slice(0, i);
    if (i >= text.length) {
      clearInterval(typeTimer);
    }
  }, 45);
}

// —— 点评缓存：同一幅画（描述相同）只调一次大模型，重复打开直接读缓存 ——
const LS_SPRITE = "kd_sprite_review_v1";
function readSpriteCache() {
  try { return JSON.parse(localStorage.getItem(LS_SPRITE) || "null"); } catch (e) { return null; }
}
function writeSpriteCache(desc, review) {
  try { localStorage.setItem(LS_SPRITE, JSON.stringify({ desc: desc, review: review })); } catch (e) { /* 满了就算了 */ }
}

// 请求 AI 点评；force=false 且画面没变时直接用缓存，不调用大模型
// 任何失败都降级为本地夸夸（本地夸夸不写缓存，下次联网还能拿到 AI 版），绝不冷场
async function requestSpriteReview(force) {
  stopSpriteWork();
  const desc = spriteInfo.text;
  const cache = readSpriteCache();
  if (!force && cache && cache.desc === desc && cache.review) {
    typewriteSprite(cache.review);   // 缓存命中：秒出，零 API 调用
    return;
  }
  const box = $("spriteText");
  box.classList.add("loading");
  box.textContent = "亮晶晶正扇着小翅膀飞过来看画…";
  try {
    spriteFetchCtrl = new AbortController();
    const timer = setTimeout(() => spriteFetchCtrl.abort(), 18000);
    const resp = await fetch("/api/review", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ description: desc }),
      signal: spriteFetchCtrl.signal
    });
    clearTimeout(timer);
    if (!resp.ok) throw new Error("http_" + resp.status);
    const data = await resp.json();
    if (!data || !data.review) throw new Error("empty");
    const review = String(data.review);
    writeSpriteCache(desc, review);   // 只缓存 AI 成功结果
    typewriteSprite(review);
  } catch (e) {
    typewriteSprite(localPraise(spriteInfo));
  } finally {
    spriteFetchCtrl = null;
  }
}

$("spriteBtn").addEventListener("click", openSpriteModal);
$("spriteOk").addEventListener("click", closeSpriteModal);
// 「再听一遍」= 强制生成新点评，但 10 秒内连点不重复调用（防小朋友刷按钮烧 API）
let spriteAgainAt = 0;
$("spriteAgain").addEventListener("click", () => {
  const now = Date.now();
  if (now - spriteAgainAt < 10000) {
    toast("亮晶晶还在想，等一小下～");
    return;
  }
  spriteAgainAt = now;
  requestSpriteReview(true);
});
$("spriteModal").addEventListener("click", e => { if (e.target.id === "spriteModal") closeSpriteModal(); });

init();

// 注册离线缓存：首次打开成功后，即使断网也能继续进入画板。
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
      .catch(err => console.warn("离线功能暂时不可用：", err));
  });
}
</script>
